services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: "${IPINFO_IMAGE:-ipinfo-dog:local}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GEOIP_DATABASE_DIR: /data/maxmind
      GEOIP_MANAGED: "1"
      IPINFO_EXIT_TOKEN_FILE: /run/secrets/exit_proxy_token
    secrets:
      - exit_proxy_token
    volumes:
      - "${IPINFO_MMDB_DIR:?Set IPINFO_MMDB_DIR outside the checkout}:/data/maxmind:ro"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
secrets:
  exit_proxy_token:
    file: "${IPINFO_EXIT_TOKEN_PATH:?Set IPINFO_EXIT_TOKEN_PATH outside the checkout}"
